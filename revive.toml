fignoreGeneratedHeader = true
severity = "error"
confidence = 0.8
errorCode = 1
warningCode = 0
enableAllRules = true
ignore = ["TEST"]

[rule.line-length-limit]
arguments = [120]

[rule.add-constant]
arguments = [
    { max-lit-count = "3", allow-strs = "\"\"", allow-ints = "0,1,2,4,8,64", allow-floats = "0.0,0.,1.0,1.,2.0,2.", ignore-funcs = "os\\.*,fmt\\.Println,make" },
]