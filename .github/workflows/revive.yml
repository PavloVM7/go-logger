name: Revive

on:
  pull_request:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'revive.toml'
      
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Revive Action
        # You may pin to the exact commit or the version.
        # uses: morphy2k/revive-action@bd8016177e3722fe0aad85e22507805641be5bb1
        uses: morphy2k/revive-action@v2.7.8
        with:
          # Path of the Revive config file
          config: revive.toml
          # Revive exclude patterns, separated by newline
          exclude: |
            internal/slog/handlers_test.go
            internal/slog/logger_with_test.go
            logger/config_test.go
            logger/level_test.go
            logger/slog_test.go
          # Revive path pattern
          path: # optional
          # Fail on any issue. Overrides the error and warning code in config
          fail-on-any: true
